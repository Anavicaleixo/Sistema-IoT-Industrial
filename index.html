<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Monitor IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #a0b0d7;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background:#011c48;
            padding: 48px 40px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow:  0 20px 60px rgba(255, 255, 255, 0.6);
        }
        .login-card h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 6px; color: #38bdf8; }
        .login-card .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }
        .form-group input:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56,189,248,0.15); }
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s;
            margin-top: 8px;
        }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-primary:active { transform: scale(0.97); }
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            font-weight: 500;
        }
        .message.error { display: block; background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        .message.success { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
        .form-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #94a3b8; }
        .form-footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .form-footer a:hover { color: #7dd3fc; text-decoration: underline; }
        @media (max-width: 480px) {
            .login-card { padding: 32px 20px 28px; }
            .login-card h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1> Monitor IoT</h1>
        <p class="subtitle">Acesse o sistema de monitoramento</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <div id="message" class="message"></div>
        <div class="form-footer">
            Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://yheryzzihrndpmckdylm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZXJ5enppaHJuZHBtY2tkeWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDExNTIsImV4cCI6MjEwMTA3NzE1Mn0.B11x7tqcUhfJPWHsqs3IyhSmA0ZKbLiA5MfkHoWEXec';

        const supabaseClient = window.supabase.createClient('https://yheryzzihrndpmckdylm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZXJ5enppaHJuZHBtY2tkeWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDExNTIsImV4cCI6MjEwMTA3NzE1Mn0.B11x7tqcUhfJPWHsqs3IyhSmA0ZKbLiA5MfkHoWEXec');


        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageEl = document.getElementById('message');

        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            clearTimeout(window._msgTimeout);
            window._msgTimeout = setTimeout(() => { messageEl.className = 'message'; }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) {
                showMessage('Preencha todos os campos.', 'error');
                return;
            }
            const btn = form.querySelector('.btn-primary');
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    showMessage('E-mail ou senha inválidos.', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }
                showMessage('Login realizado com sucesso!', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 800);
            } catch (err) {
                showMessage('Erro ao conectar ao servidor.', 'error');
                btn.disabled = false;
                btn.textContent = 'Entrar';
                console.error(err);
            }
        });

        (async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = 'home.html';
        })();
    </script>
</body>
</html>
